name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore android/app/release.keystore \
            -alias lumora \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Lumora, OU=Dev, O=CadmusLabs, L=Earth, ST=Earth, C=US"

      - name: Patch build.gradle for release signing
        run: |
          node -e "
          const fs = require('fs');
          const gradlePath = 'android/app/build.gradle';
          let content = fs.readFileSync(gradlePath, 'utf8');

          const releaseSigning = \`
              release {
                  storeFile file('release.keystore')
                  storePassword 'android123'
                  keyAlias 'lumora'
                  keyPassword 'android123'
              }
          \`;

          content = content.replace(
            /signingConfigs\s*\{/,
            'signingConfigs {' + releaseSigning
          );

          fs.writeFileSync(gradlePath, content);
          console.log('Patched build.gradle with release signing config');
          "

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumora.apk
          path: android/app/build/outputs/apk/**/*.apk
