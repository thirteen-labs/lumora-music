name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # NOTE: the `packages` input is split on SPACES ONLY (not newlines) by the
      # action, so it must stay a single space-separated line.
      #
      # The action's built-in default is 'tools platform-tools'. The legacy
      # `tools` package no longer exists in the Android SDK repository, so the
      # default makes this step fail with:
      #   Warning: Failed to find package 'tools'
      #   sdkmanager failed with exit code 1
      # Overriding `packages` drops `tools` and pins the exact SDK components
      # this project compiles against (see react-native/gradle/libs.versions.toml).
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'
          accept-android-sdk-licenses: true

      - name: Verify Android SDK
        run: |
          sdkmanager --version
          adb --version
          sdkmanager --list_installed

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Patch gradle.properties for memory
        run: |
          node -e "
          const fs = require('fs');
          const gradlePropsPath = 'android/gradle.properties';
          let content = fs.readFileSync(gradlePropsPath, 'utf8');
          content = content.replace(
            /org\.gradle\.jvmargs=-Xmx\d+m -XX:MaxMetaspaceSize=\d+m/,
            'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m'
          );
          fs.writeFileSync(gradlePropsPath, content);
          console.log('Patched gradle.properties with increased memory');
          "

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore android/app/release.keystore \
            -alias lumora \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -dname "CN=Lumora, OU=Dev, O=CadmusLabs, L=Earth, ST=Earth, C=US"

      - name: Patch build.gradle for release signing
        run: |
          node -e "
          const fs = require('fs');
          const gradlePath = 'android/app/build.gradle';
          let content = fs.readFileSync(gradlePath, 'utf8');

          const releaseSigning = \`
              release {
                  storeFile file('release.keystore')
                  storePassword '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
                  keyAlias 'lumora'
                  keyPassword '${{ secrets.ANDROID_KEY_PASSWORD }}'
              }
          \`;

          content = content.replace(
            /signingConfigs\s*\{/,
            'signingConfigs {' + releaseSigning
          );

          fs.writeFileSync(gradlePath, content);
          console.log('Patched build.gradle with release signing config');
          "

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          NODE_OPTIONS: --max_old_space_size=8192

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumora-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
